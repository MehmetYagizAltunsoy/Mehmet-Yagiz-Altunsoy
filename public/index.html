<style>
:root{
  --bg:#F3F2FA; --bg-glow:#E6E3FA; --surface:#FFFFFF; --surface-2:#ECEAF6; --line:#D8D5EA;
  --text:#1B1D36; --muted:#5E6082; --coin:#B98200; --coin-bg:#FFC93C; --on-coin:#1B1D36;
  --down:#0F8A8F; --up:#C8324F; --focus:#4B4BD8;
  --shadow:0 1px 2px rgba(27,29,54,.06),0 8px 24px rgba(27,29,54,.08);
  --display:"Chakra Petch","Trebuchet MS",sans-serif;
  --body:"Rubik","Segoe UI",system-ui,sans-serif;
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13152A; --bg-glow:#232657; --surface:#1D2040; --surface-2:#282C54; --line:#353A68;
    --text:#EDEBFF; --muted:#A3A5C8; --coin:#FFC93C; --down:#53D8E0; --up:#FF6B86; --focus:#9EA0FF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13152A; --bg-glow:#232657; --surface:#1D2040; --surface-2:#282C54; --line:#353A68;
  --text:#EDEBFF; --muted:#A3A5C8; --coin:#FFC93C; --down:#53D8E0; --up:#FF6B86; --focus:#9EA0FF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}

/* ---------- renk seçenekleri ---------- */
:root{--coin-bg2:#ff9f5a}
:root[data-accent="mint"]{--coin-bg:#3DDCB0;--coin-bg2:#3BB8E8;--coin:#0B7A62;--on-coin:#0F2A24}
@media (prefers-color-scheme: dark){:root[data-accent="mint"]:not([data-theme="light"]){--coin:#5BE6C0}}
:root[data-accent="mint"][data-theme="dark"]{--coin:#5BE6C0}
:root[data-accent="violet"]{--coin-bg:#B197FF;--coin-bg2:#FF8FCF;--coin:#6A45D6;--on-coin:#1B1036}
@media (prefers-color-scheme: dark){:root[data-accent="violet"]:not([data-theme="light"]){--coin:#C2AEFF}}
:root[data-accent="violet"][data-theme="dark"]{--coin:#C2AEFF}
:root[data-accent="coral"]{--coin-bg:#FF7F6E;--coin-bg2:#FFB45E;--coin:#BF3B2A;--on-coin:#2A0F0B}
@media (prefers-color-scheme: dark){:root[data-accent="coral"]:not([data-theme="light"]){--coin:#FF9D8F}}
:root[data-accent="coral"][data-theme="dark"]{--coin:#FF9D8F}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;display:grid;place-items:center;transition:transform .15s}
.swatches button:hover{transform:scale(1.08)}
.swatches button[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 3px var(--surface) inset}
.swatches button[aria-pressed="true"]::after{content:"✓";font:700 15px var(--body);color:#1B1D36}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{margin:0;min-height:100%;color:var(--text);font:400 16px/1.55 var(--body);
  background:radial-gradient(1200px 500px at 15% -10%,var(--bg-glow),transparent 70%),var(--bg);background-attachment:fixed}
img{max-width:100%}
[hidden]{display:none!important}
/* kaydırma çubukları */
html{scrollbar-color:var(--coin-bg) var(--bg)}
*{scrollbar-width:thin;scrollbar-color:var(--coin-bg) transparent}
::-webkit-scrollbar{width:12px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--coin-bg),var(--coin-bg2));border-radius:999px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--coin-bg)}
::-webkit-scrollbar-corner{background:transparent}
html,body{overflow-x:clip}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;flex:none}

/* ---------- üst çubuk (sabit) ---------- */
header.top{position:fixed;top:0;left:0;right:0;padding-top:env(safe-area-inset-top,0px);z-index:30;transition:box-shadow .35s,background .35s;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px) saturate(1.2);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:70px;transition:height .35s cubic-bezier(.2,.8,.2,1)}
.bar .search,.bar .mark,.bar .logo,.bar .tagline,.bar .btn,.bar .icon{transition:all .35s cubic-bezier(.2,.8,.2,1)}
.tagline{max-height:20px;overflow:hidden}
header.top.compact{box-shadow:0 8px 24px rgba(0,0,0,.25)}
header.top.compact .bar{height:54px}
header.top.compact .search{height:38px;max-width:440px;box-shadow:none}
header.top.compact .logo{font-size:20px}
header.top.compact .mark{width:26px;height:26px}
header.top.compact .tagline{max-height:0;margin-top:0;opacity:0}
header.top.compact .btn{height:34px}
header.top.compact .icon{width:34px;height:34px}
.brand{display:flex;flex-direction:column;justify-content:center;min-width:0}
.logo{font:700 25px/1 var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer}
.mark{width:34px;height:34px;flex:none;transform:rotate(-8deg);filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));transition:transform .3s}
.logo:hover .mark{transform:rotate(0deg) scale(1.06)}
.tagline{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;height:46px;max-width:560px;margin:0 auto;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--focus)}
.search input{flex:1;border:0;background:transparent;font-size:16px;height:100%;min-width:0}
.search input:focus{outline:none}
.search input::-webkit-search-cancel-button{display:none}
.clear{border:0;background:var(--surface-2);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:13px;color:var(--muted)}
.actions{display:flex;gap:6px;align-items:center}
.icon{width:40px;height:40px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:10px;cursor:pointer;color:var(--muted)}
.icon:hover{background:var(--surface-2);color:var(--text)}
.btn{height:40px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--text) 30%,var(--line))}
.btn.primary{background:var(--coin-bg);color:var(--on-coin);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.panelhead h3{margin:0}
.seg.rangeseg button{height:30px;padding:0 10px;font-size:13px}
.advice{display:flex;flex-direction:column;gap:3px;margin-top:12px;padding:12px 14px;border-radius:12px;border-left:4px solid var(--muted);background:var(--surface-2);font-size:14.5px;line-height:1.45}
.advice b{font:700 15px var(--display)}
.advice.good{border-left-color:var(--down);background:color-mix(in srgb,var(--down) 12%,var(--surface))}
.advice.good b{color:var(--down)}
.advice.wait{border-left-color:var(--coin-bg);background:color-mix(in srgb,var(--coin-bg) 16%,var(--surface))}
.advice.ok b,.advice.info b{color:var(--text)}
.copylink{height:36px;font-size:14px;color:var(--muted)}
.copylink svg{width:16px;height:16px}
.copylink:hover{color:var(--text);border-color:var(--coin)}
.btn.danger{color:var(--up);border-color:color-mix(in srgb,var(--up) 45%,var(--line))}
.btn:disabled{opacity:.5;cursor:default}
.wishcount{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--coin-bg);color:var(--on-coin);font-size:12px;font-weight:600;padding:0 5px}
.wishcount:empty,.wishcount[data-n="0"]{display:none}

/* ---------- ana sayfa arka planı: soluk oyun kapakları ---------- */
.backdrop{position:absolute;top:0;left:0;right:0;height:640px;overflow:hidden;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.85) 35%,transparent 100%);
          mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.85) 35%,transparent 100%)}
.backdrop[hidden]{display:none}
.backdrop .wall{position:absolute;inset:-30% -10%;display:flex;flex-direction:column;gap:16px;transform:rotate(-7deg);
  opacity:.13;filter:saturate(.6) blur(1.5px)}
:root[data-theme="light"] .backdrop .wall{opacity:.1;filter:saturate(.5) blur(1.5px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .backdrop .wall{opacity:.1}}
.backdrop .lane{display:flex;gap:16px;width:max-content;animation:lane 260s linear infinite}
.backdrop .lane:nth-child(2n){animation-direction:reverse;animation-duration:300s}
.backdrop .lane .cov{width:118px;aspect-ratio:3/4;border-radius:12px;flex:none;font-size:0;padding:0}
.backdrop .lane .cov::after{display:none}
.backdrop::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 420px at 30% 30%,transparent,var(--bg) 85%)}
main,footer{position:relative;z-index:1}
body{position:relative}

/* ---------- giriş bölümü ---------- */
.hero{padding:40px 0 10px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.hero h1{font:700 clamp(30px,5vw,54px)/1.02 var(--display);margin:0 0 10px;letter-spacing:-.02em;max-width:15ch}
.hero p{color:var(--muted);margin:0;max-width:58ch}
.stats{display:flex;gap:10px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.stats li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:96px}
.stats b{display:block;font:700 22px/1.1 var(--display)}
.stats span{font-size:12px;color:var(--muted)}

section{padding:22px 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font:600 23px/1.2 var(--display);margin:0}
.sec-head span{color:var(--muted);font-size:14px}

/* ---------- fiyat etiketi ---------- */
.tag{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-family:var(--display)}
.tag .now{font-weight:700;font-size:19px;white-space:nowrap}
.tag .was{color:var(--muted);text-decoration:line-through;font-size:13px;white-space:nowrap}
.tag .off{background:var(--coin-bg);color:var(--on-coin);font-weight:700;font-size:12px;padding:2px 7px;border-radius:6px;transform:rotate(-3deg);white-space:nowrap}

/* ---------- giriş düzeni ---------- */
.hero{grid-template-columns:1fr!important}
.hero-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}

/* ---------- vitrin: indirimdeki popüler oyunlar, kayan slaytlar ---------- */
.show{position:relative;height:clamp(300px,38vw,440px);border-radius:22px;overflow:hidden;background:#0d0f22;box-shadow:var(--shadow);outline:none;touch-action:pan-y}
.slides{display:flex;height:100%;transition:transform .8s cubic-bezier(.65,0,.35,1)}
.slide{position:relative;flex:0 0 100%;height:100%;display:grid;align-items:end;cursor:pointer;isolation:isolate;overflow:hidden}
.slide .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.03);transition:transform 7s ease-out}
.slide.on .bg{transform:scale(1.1)}
.slide .fallback{position:absolute;inset:0;z-index:-3}
.slide .fallback .cov{position:absolute;inset:0;border-radius:0;filter:blur(18px) saturate(1.2);transform:scale(1.2)}
.slide::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,11,28,.92) 0%,rgba(10,11,28,.6) 42%,rgba(10,11,28,.05) 100%),linear-gradient(0deg,rgba(10,11,28,.75),transparent 55%)}
.slide-body{padding:30px 34px 40px 82px;color:#fff;max-width:680px}
.slide .eyebrow{display:inline-flex;gap:6px;align-items:center;font:700 13px var(--display);letter-spacing:.05em;color:var(--on-coin);background:var(--coin-bg);padding:5px 12px;border-radius:999px}
.slide h2{font:700 clamp(26px,4vw,46px)/1.05 var(--display);margin:12px 0 10px;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.slide .tag .now{font-size:28px}
.slide .tag .was{color:#c9c9e0}
.slide .meta2{font-size:14px;color:#d6d6ec;margin-top:6px}
.slide-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px}
.slide .btn.primary{background:var(--coin-bg);color:var(--on-coin);border-color:transparent}
.snav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);color:#fff;font-size:26px;line-height:1;cursor:pointer;opacity:0;transition:opacity .25s;z-index:2}
.show:hover .snav,.show:focus-within .snav{opacity:1}
@media (hover:none){.snav{opacity:.85;width:38px;height:38px;font-size:22px}}
.snav.prev{left:14px}.snav.next{right:14px}
.sdots{position:absolute;right:22px;bottom:18px;display:flex;gap:6px;z-index:2}
.sdots button{width:9px;height:9px;border-radius:5px;border:0;padding:0;background:rgba(255,255,255,.45);cursor:pointer;transition:width .3s,background .3s}
.sdots button[aria-current="true"]{width:28px;background:var(--coin-bg)}
.sbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);z-index:2}
.sbar i{display:block;height:100%;width:0;background:var(--coin-bg)}
.sbar i.run{animation:sprog var(--slide-ms,5000ms) linear forwards}
.show.paused .sbar i{animation-play-state:paused}
@keyframes sprog{to{width:100%}}
@media (max-width:720px){.slide-body{padding:20px 20px 36px}.sdots{right:50%;transform:translateX(50%)}.snav{display:none}}

/* ---------- yaklaşık karşılık, ücretsiz oyunlar, benzer oyunlar ---------- */
.approx{font:500 12.5px var(--body);color:var(--muted);white-space:nowrap}
.slide .approx{color:#d6d6ec;font-size:14px}
.frees{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding:4px 2px 12px}
.free{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.free:hover{transform:translateY(-2px);border-color:var(--coin-bg);box-shadow:0 0 0 1px var(--coin-bg)}
.free .cov{height:104px;border-radius:8px;font-size:0;padding:0}
.free h3{font:600 15.5px/1.2 var(--display);margin:0 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.freebadge{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--display);color:#0b3b2e;background:#57e3b0;padding:3px 10px;border-radius:999px}
.free .was{color:var(--muted);text-decoration:line-through;font-size:13px;margin-left:6px}
.free .ends{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.35}
.countdown{font-weight:600;color:var(--text)}
.atiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.atile{display:flex;flex-direction:column;gap:2px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.atile b{font:700 26px/1.1 var(--display)}
.atile span{font-weight:600}
.atile small{color:var(--muted);font-size:12.5px}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:12px}
.alist{list-style:none;margin:6px 0 0;padding:0}
.alist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.alist li:first-child{border-top:0}
.alist small{color:var(--muted);white-space:nowrap}
ol.alist{counter-reset:a}
.cmpbar{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:36;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.25)}
.cmpbar[hidden]{display:none}
.cmpthumbs{display:flex;gap:6px}
.cmpthumb .cov{width:34px;height:45px;border-radius:6px;font-size:0;padding:0}
.cmpbar .btn[disabled]{opacity:.55;cursor:not-allowed}
table.cmp{width:100%;border-collapse:collapse;min-width:560px}
table.cmp th,table.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp tbody th{color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap;width:1%}
table.cmp thead th{vertical-align:bottom}
.cmpcov{display:grid;gap:8px;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--text);font:inherit}
.cmpcov .cov{width:110px;height:146px;border-radius:10px;font-size:0;padding:0}
.cmpcov b{font:600 16px/1.25 var(--display)}
.advtag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2)}
.advtag.good{background:color-mix(in srgb,var(--down) 18%,var(--surface));color:var(--down)}
.advtag.wait{background:color-mix(in srgb,var(--coin-bg) 30%,var(--surface))}
@media (max-width:640px){.cmpbar{left:12px;right:84px;bottom:14px}.cmpbar .btn{flex:1}}
.countdown.soon{color:var(--up)}
.ending .tag{margin-top:2px}
.sim{margin-top:18px}
.simrow{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:14px;overflow-x:auto;padding-bottom:6px}
.simcard{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.simcard .cov{aspect-ratio:3/4;border-radius:10px;font-size:12px}
.simcard b{font:600 14px/1.2 var(--display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.simcard .tag .now{font-size:15px}

/* ---------- kategoriler ve filtreler ---------- */
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.cats button{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--coin-bg);color:var(--on-coin);border-color:transparent;font-weight:600}
.cats button small{color:var(--muted);margin-left:5px;font-size:12px}
.cats button[aria-pressed="true"] small{color:inherit;opacity:.7}
.rate{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex:none;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--surface-2)}
.rate.good{color:var(--down)} .rate.mid{color:var(--coin)} .rate.bad{color:var(--up)}
.card .row1{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}

.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- araç çubuğu ---------- */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.count{font:600 22px/1.2 var(--display);margin:0}
.count small{font:400 14px var(--body);color:var(--muted);margin-left:8px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.select{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;cursor:pointer;max-width:100%}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--coin)}
.az{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 18px}
.az button{min-width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:600 13px var(--display);cursor:pointer;padding:0 8px}
.az button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ---------- oyun kartları ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px 18px}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-width:0}
.card .cov{aspect-ratio:3/4;border-radius:12px;box-shadow:var(--shadow);
  transform:perspective(800px) rotateY(calc(var(--mx,0)*7deg)) rotateX(calc(var(--my,0)*-7deg));transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card h3{font:600 16px/1.25 var(--display);margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta,.card .from{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .alt{font-size:12px;color:var(--muted)}
@media (hover:hover) and (pointer:fine){
  .card:hover .cov{box-shadow:0 18px 40px rgba(20,20,50,.28)}
  .card:hover .cov img{transform:scale(1.14) translate(calc(var(--mx,0)*5%),calc(var(--my,0)*5%))}
  .card:hover .cov::after{opacity:1}
}
.empty,.state{padding:40px 0;color:var(--muted);grid-column:1/-1}
.more-wrap{display:flex;justify-content:center;margin-top:30px}
.more-wrap .btn{height:46px;padding:0 24px}

/* üretilen yedek kapak + gerçek kapak */
.cov{position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;color:#fff;font:700 15px/1.1 var(--display);text-shadow:0 1px 3px rgba(0,0,0,.45);background:#2a2d52}
.cov::before{content:"";position:absolute;inset:0;background:var(--pat)}
.cov::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(circle at calc(50% + var(--mx,0)*50%) calc(50% + var(--my,0)*50%),rgba(255,255,255,.28),transparent 55%)}
.cov span{position:relative}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s cubic-bezier(.2,.8,.2,1)}

/* ---------- pencereler ---------- */
dialog{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:20px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog.wide{width:min(1120px,calc(100% - 24px))}
html:has(dialog[open]),html:has(.welcome:not([hidden])){overflow:hidden}
html{scrollbar-gutter:stable}
dialog,dialog .dlg{overscroll-behavior:contain}
dialog::backdrop{background:rgba(10,10,25,.62);backdrop-filter:blur(3px)}
.dlg{padding:24px}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.dlg-head h2{font:700 26px/1.15 var(--display);margin:0}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:17px;flex:none}
.note{font-size:14px;color:var(--muted);margin:8px 0}

/* oyun sayfası */
.dh{display:grid;grid-template-columns:190px 1fr;gap:26px;align-items:start}
.dh .cov{aspect-ratio:3/4;border-radius:14px;font-size:20px;box-shadow:var(--shadow)}
.dh h2{font:700 clamp(26px,3.4vw,38px)/1.08 var(--display);margin:0 0 10px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.chips li{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0 0 16px;font-size:15px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.best{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:var(--surface-2)}
.best .lbl{font-size:13px;color:var(--muted)}
.best .tag .now{font-size:28px}
.best .actions{margin-left:auto}
.best .actions{flex-wrap:wrap}
.dh>div{min-width:0}
.dgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;margin-top:22px;align-items:start}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h3{font:600 17px var(--display);margin:0 0 10px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:500;font-size:13px}
tr.best-row td:first-child{font-weight:600}
td .tag{flex-wrap:nowrap}
.badge{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);margin-left:6px}
tr.best-row .badge{background:var(--coin-bg);color:var(--on-coin)}
.shoplink{display:inline-flex;align-items:center;gap:4px;text-underline-offset:3px;font-size:14px}
svg.chart{display:block;width:100%;height:auto}
.trend{font-size:14px;font-weight:500}
.trend.down{color:var(--down)} .trend.up{color:var(--up)}
.lows{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13.5px;color:var(--muted)}
.lows b{color:var(--text);font-family:var(--display);font-size:15px}

/* formlar */
.form label{display:block;font-size:14px;color:var(--muted);margin:12px 0 5px}
.form input[type=email],.form input[type=password],.form input[type=text]{width:100%;height:46px;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:0 13px}
.form .err{color:var(--up);font-size:14px;min-height:20px;margin-top:8px}
.linkbtn{background:none;border:0;padding:0;color:var(--text);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--text);color:var(--bg)}

/* ayarlar & yardım */
.set{border-top:1px solid var(--line);padding:16px 0}
.set:first-of-type{border-top:0}
.set h3{font:600 16px var(--display);margin:0 0 10px}
/* yeni ayarlar düzeni: kartlar ve açıklamalı satırlar */
.sgroup{margin:18px 0 0}
.sgroup>h3{font:600 12.5px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 4px}
.scard{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .lbl{min-width:0}
.srow .lbl b{display:block;font-weight:500;font-size:15px}
.srow .lbl small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.4}
.srow .select{max-width:220px}
.srow.link{cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit}
.srow.link:hover{background:var(--surface-2)}
.srow.link::after{content:"›";font-size:22px;color:var(--muted)}
.switch{position:relative;flex:none;width:46px;height:27px}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+i{background:var(--coin-bg)}
.switch input:checked+i::after{transform:translateX(19px)}
.switch input:focus-visible+i{outline:3px solid var(--focus);outline-offset:2px}
.switch input:disabled+i{opacity:.45}
/* profil */
.avatar{position:relative;display:inline-grid;place-items:center;flex:none;border-radius:50%;overflow:hidden;background:var(--coin-bg);color:var(--on-coin);font:700 15px var(--display)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.userbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer;max-width:200px}
.userbtn:hover{border-color:var(--coin)}
.userbtn .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
header.top.compact .userbtn{height:34px}
.phead{display:flex;align-items:center;gap:18px;padding:6px 0 4px}
.phead .avatar{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--coin-bg)}
.phead h2{font:700 24px/1.15 var(--display);margin:0}
.phead p{margin:3px 0 0;color:var(--muted);font-size:14px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 4px;overflow-x:auto}
.ptabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.ptabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--coin-bg)}
.avpick{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:16px}@media (max-width:480px){.avpick{padding:12px}}
.avnow{display:flex;align-items:center;gap:14px}
.avnow .avatar{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--coin-bg)}
.avnow .lbl{flex:1;min-width:0}
.avnow b{display:block;font-size:15.5px}
.avnow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.avbar{display:flex;gap:10px;align-items:center;margin:16px 0 12px;flex-wrap:wrap}
.avbar .seg{flex:none}
.avsrch{position:relative;flex:1;min-width:180px}
.avsrch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.avsearch{width:100%;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px 0 36px}
.avsearch:focus{outline:2px solid var(--coin-bg);outline-offset:1px;border-color:transparent}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:14px 6px;max-height:320px;overflow-y:auto;padding:6px 4px 4px;overscroll-behavior:contain}
.avgrid button{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;padding:0;cursor:pointer;color:var(--text);min-width:0}
.avgrid .ring{position:relative;width:68px;height:68px;border-radius:50%;overflow:hidden;background:var(--surface);box-shadow:0 0 0 2px var(--line);transition:box-shadow .15s,transform .15s}
.avgrid .ring .cov{position:absolute;inset:0;border-radius:0;padding:0;font-size:0}
.avgrid .ring img{object-position:50% 30%}
.avgrid .ring.letter{display:grid;place-items:center;background:var(--coin-bg);color:var(--on-coin);font:700 28px var(--display)}
.avgrid button:hover .ring{transform:translateY(-2px);box-shadow:0 0 0 2px var(--coin)}
.avgrid button:focus-visible{outline:none}.avgrid button:focus-visible .ring{box-shadow:0 0 0 3px var(--coin)}
.avgrid button[aria-pressed="true"] .ring{box-shadow:0 0 0 3px var(--coin-bg),0 0 0 6px color-mix(in srgb,var(--coin-bg) 30%,transparent)}
.avgrid button[aria-pressed="true"]::after{content:"✓";position:absolute;margin:50px 0 0 50px;width:22px;height:22px;border-radius:50%;background:var(--coin-bg);color:var(--on-coin);font:700 12px/22px var(--body,inherit);text-align:center;box-shadow:0 0 0 2px var(--surface-2)}
.avgrid button{position:relative}
.avgrid .tt{font-size:11.5px;line-height:1.25;text-align:center;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%;word-break:break-word}
.avgrid button[aria-pressed="true"] .tt{color:var(--text);font-weight:600}
.avgrid .sk .ring{animation:avsk 1.2s ease-in-out infinite;box-shadow:none;background:var(--line)}
.avgrid .sk .tt{height:10px;width:60%;border-radius:4px;background:var(--line)}
@keyframes avsk{50%{opacity:.45}}
.avgrid .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
@media (max-width:720px){.userbtn .nm{display:none}.userbtn{padding:0 4px}.srow:has(.seg,.select,input[type=text]){flex-wrap:wrap}.srow .select{max-width:100%}}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:6px 0;flex-wrap:wrap}
.row > span{font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;height:38px;padding:0 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
details.faq{border-bottom:1px solid var(--line);padding:12px 0}
details.faq summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.faq summary::after{content:"+";color:var(--muted);font-size:20px;line-height:1}
details.faq[open] summary::after{content:"−"}
details.faq p{color:var(--muted);margin:8px 0 0}
.contact{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

/* istek listesi */
.wish-item{display:grid;grid-template-columns:56px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wish-item .cov{height:74px;border-radius:8px;font-size:9px;padding:5px}
.wish-item .t{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:600 16px/1.2 var(--display)}
.notice{background:color-mix(in srgb,var(--coin-bg) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--coin-bg) 45%,var(--line));border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 14px}
.consent{align-items:flex-start!important;margin-top:12px;font-size:13.5px!important;line-height:1.45}
.consent input{margin:2px 8px 0 0;flex:none}
.consent{gap:10px!important}
.forgot-row{display:flex;justify-content:flex-end;margin-top:6px}
.atl{display:inline-flex;align-items:center;gap:4px;font:600 11.5px var(--body);color:#0b3b2e;background:#57e3b0;padding:2px 8px;border-radius:999px;white-space:nowrap}
.target{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.target input{width:120px;height:38px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:0 10px}
.dcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.req{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.req h4{margin:0 0 6px;font:600 14px var(--display);color:var(--muted)}
.req dl{margin:0;display:grid;gap:6px;font-size:13.5px}
.req dt{color:var(--muted);font-size:12px}
.req dd{margin:0 0 4px}
.legal{max-width:760px}
.legal h2{font:700 24px var(--display);margin:0 0 12px}
.legal h3{font:600 16px var(--display);margin:18px 0 6px}
.legal p,.legal li{color:var(--text);font-size:14.5px;line-height:1.6}
.legal mark{background:var(--coin-bg);color:var(--on-coin);padding:0 4px;border-radius:4px}
.cookiebar{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;max-width:620px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.35);font-size:14px}
.cookiebar span{flex:1;min-width:220px}
.mail{font-size:14px;color:var(--muted);border-left:3px solid var(--coin-bg);padding:6px 10px;margin:6px 0;background:var(--surface-2);border-radius:0 8px 8px 0}

/* ---------- karşılama ekranı ---------- */
.welcome{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;overflow:hidden;background:#0d0f22}
.welcome[hidden]{display:none}
.welcome .wall{position:absolute;inset:-25% -10%;display:flex;flex-direction:row;justify-content:center;gap:16px;transform:rotate(-10deg);opacity:.6}
.welcome .wall .lane{display:flex;flex-direction:column;gap:16px;height:max-content;animation:colUp 55s linear infinite}
.welcome .wall .lane:nth-child(2n){animation-name:colDown;animation-duration:65s}
.welcome .wall .lane:nth-child(3n){animation-duration:48s}
@keyframes colUp{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes colDown{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.welcome .wall .lane .cov{width:150px;aspect-ratio:3/4;border-radius:12px;flex:none;font-size:13px}
@keyframes lane{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.welcome::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(13,15,34,.55),rgba(13,15,34,.92) 70%)}
.welcome{overflow-y:auto!important}
.welcome-card{position:relative;z-index:1;width:min(960px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:0;border-radius:26px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.08);margin:auto}
.wintro{position:relative;overflow:hidden;padding:44px 40px;color:#F3F1FF;background:linear-gradient(160deg,rgba(29,32,64,.82),rgba(13,15,34,.9));backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:22px}
.wintro::before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-140px;top:-140px;background:radial-gradient(circle,var(--coin-bg),transparent 65%);opacity:.28;pointer-events:none}
.wintro .logo{font-size:26px;color:#fff;cursor:default}
.wintro .hi{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;font:600 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--on-coin);background:var(--coin-bg);padding:6px 12px;border-radius:999px}
.wintro h1{font:700 clamp(30px,3.6vw,42px)/1.08 var(--display);margin:0;letter-spacing:-.01em}
.wintro h1 em{font-style:normal;background:linear-gradient(90deg,var(--coin-bg),var(--coin-bg2));-webkit-background-clip:text;background-clip:text;color:transparent}
.wintro .sub{margin:0;color:#B9BADB;font-size:16px;line-height:1.55}
.wfeat{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:14px}
.wfeat li{display:flex;gap:14px;align-items:flex-start}
.wfeat .ic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--coin-bg)}
.wfeat .ic svg{width:20px;height:20px}
.wfeat b{display:block;font-weight:600;color:#fff}
.wfeat small{color:#A9AACD;font-size:14px}
.wform{background:var(--surface);padding:36px 34px;display:flex;flex-direction:column}
.wform h2{font:700 24px/1.2 var(--display);margin:0 0 4px}
.wform .lead{color:var(--muted);margin:0 0 6px;font-size:15px}
.wform .tabs{margin:0 0 6px}
@media (max-width:820px){
  .welcome{place-items:start center!important;padding:14px!important}
  .welcome-card{grid-template-columns:1fr}
  .wintro{padding:28px 24px;gap:14px}
  .wfeat{display:none}
  .wform{padding:26px 22px}
}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* başa dön düğmesi */
.totop{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:35;
  width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;
  display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);
  opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;transition:opacity .3s,transform .3s,bottom .3s,border-color .2s}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop:hover{border-color:var(--coin)}
.totop:hover .arrow{transform:translateY(-2px)}
.totop svg.ring{position:absolute;inset:-1px;width:52px;height:52px;transform:rotate(-90deg)}
.totop .ring circle{fill:none;stroke-width:3}
.totop .ring .track{stroke:transparent}
.totop .ring .prog{stroke:var(--coin-bg);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.totop .arrow{width:22px;height:22px;transition:transform .2s}
body.cookie-on .totop{bottom:calc(var(--cb,110px) + 28px + env(safe-area-inset-bottom,0px))}
@media (max-width:720px){.totop{right:14px;width:46px;height:46px}.totop svg.ring{width:46px;height:46px}}

/* bildirim */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:calc(100% - 32px);transition:.25s;z-index:80;pointer-events:none}
.toast{inset:auto auto calc(20px + env(safe-area-inset-bottom,0px)) 50%;margin:0;border:0;height:auto;width:max-content;overflow:visible;box-shadow:0 10px 30px rgba(0,0,0,.35);background:linear-gradient(135deg,var(--coin-bg),var(--coin-bg2));color:var(--on-coin);font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tgt-err{flex-basis:100%;color:var(--up);font-size:14px;margin:0}

footer{padding:30px 0 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:30px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:inherit;text-decoration:underline;text-underline-offset:2px}footer a:hover{color:var(--text)}
footer .legalnote{flex-basis:100%;margin:6px 0 0;font-size:12px;line-height:1.5;opacity:.85;max-width:900px}

@media (max-width:720px){.req{grid-template-columns:1fr}}
@media (max-width:980px){
  .hero-main{grid-template-columns:1fr}
  .tagline{display:none}
  .hero{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr}
}
@media (max-width:720px){
  .bar{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap;gap:8px}
  .brand{order:1;flex:1 1 0;min-width:0}
  .logo{font-size:22px}
  #themeBtn,#helpBtn{display:none}
  .actions{order:2}
  .search{order:3;flex-basis:100%;max-width:none;height:44px}
  .btn .lbl{display:none}
  .btn{padding:0 11px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .dh{grid-template-columns:1fr}
  .dh .cov{max-width:150px}
  .dlg{padding:18px}
  .az button{min-width:30px;height:30px}
  .best .actions{margin-left:0}
  .wish-item{grid-template-columns:48px 1fr auto}
  .wish-item .rm{grid-column:2/-1;justify-self:start}
}
@media (prefers-reduced-motion: reduce){
  .backdrop .lane,.welcome .wall .lane{animation-duration:400s!important}
  *{scroll-behavior:auto!important}
}
/* ===== Görsel iyileştirmeler ===== */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* yatay listeler: kalın kaydırma çubuğu yerine kenar okları ve yumuşak kenar solması */
.hs{position:relative}
.hs>.frees,.hs>.cats,.hs>.simrow{scrollbar-width:none;scroll-behavior:smooth;overscroll-behavior-x:contain}
.hs>.frees::-webkit-scrollbar,.hs>.cats::-webkit-scrollbar,.hs>.simrow::-webkit-scrollbar{display:none}
.hs.l>*:first-child{-webkit-mask-image:linear-gradient(90deg,transparent,#000 56px);mask-image:linear-gradient(90deg,transparent,#000 56px)}
.hs.r>*:first-child{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}
.hs.l.r>*:first-child{-webkit-mask-image:linear-gradient(90deg,transparent,#000 56px,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,transparent,#000 56px,#000 calc(100% - 56px),transparent)}
.hs-btn{position:absolute;top:50%;z-index:2;width:42px;height:42px;margin-top:-26px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);color:var(--text);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s,background .2s}
.hs-btn svg{width:18px;height:18px}
.hs-btn.prev{left:-8px}.hs-btn.next{right:-8px}
.hs-btn:hover{background:var(--coin-bg);color:var(--on-coin);border-color:var(--coin-bg);transform:scale(1.06)}
.hs.cats-wrap .hs-btn{width:34px;height:34px;margin-top:-22px}
@media (hover:hover) and (pointer:fine){.hs:hover.l .hs-btn.prev,.hs:hover.r .hs-btn.next,.hs:focus-within.l .hs-btn.prev,.hs:focus-within.r .hs-btn.next{opacity:1;pointer-events:auto}}
/* indirim kademeleri: büyük indirim daha dikkat çekici */
.tag .off.t1{background:color-mix(in srgb,var(--coin-bg) 22%,transparent);color:var(--text);transform:none;font-weight:600}
.tag .off.t3{box-shadow:0 0 0 2px color-mix(in srgb,var(--coin-bg) 35%,transparent)}
.tag .off.t4{background:linear-gradient(135deg,var(--coin-bg),var(--coin-bg2,var(--coin-bg)));box-shadow:0 0 14px color-mix(in srgb,var(--coin-bg) 55%,transparent);font-size:12.5px;padding:2px 8px}
/* yüklenirken iskelet kartlar */
.skel{pointer-events:none}
.skel .cov,.skel i{display:block;background:linear-gradient(100deg,var(--surface-2) 30%,color-mix(in srgb,var(--surface-2) 55%,var(--line)) 50%,var(--surface-2) 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite;border-radius:6px}
.skel .cov{border-radius:12px;box-shadow:none}
.skel i{height:13px}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
/* kaydırınca beliren bölümler ve kartlar */
.js-rv .rv{opacity:0;transform:translateY(22px)}
.js-rv .rv.in{opacity:1;transform:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
@media (prefers-reduced-motion:reduce){.js-rv .rv{opacity:1;transform:none}.skel .cov,.skel i{animation:none}.hs>*{scroll-behavior:auto}}
/* boş ekranlar */
.nada{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:46px 16px;color:var(--muted)}
.nada .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--coin-bg) 16%,transparent);color:var(--coin-bg);margin-bottom:4px}
.nada .ic svg{width:30px;height:30px}
.nada b{color:var(--text);font:600 18px var(--display)}
.nada p{margin:0;max-width:380px;font-size:14.5px;line-height:1.5}
.nada .btn{margin-top:6px}
/* üst menü: kaydırınca daha saydam, buzlu cam */
header.top.compact{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6)}
</style>
</head>

async function api(path,opt={}){
  const r=await fetch(path,{method:opt.method||"GET",credentials:"same-origin",
    headers:opt.body?{"Content-Type":"application/json"}:{},body:opt.body?JSON.stringify(opt.body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(d.code||r.status),{code:d.code||"server"});
  return d;
}

function ago(iso){

  if(s<60)return rtf.format(0,"second");if(s<3600)return rtf.format(-Math.round(s/60),"minute");
  if(s<86400)return rtf.format(-Math.round(s/3600),"hour");return rtf.format(-Math.round(s/86400),"day");
}

/* Kapak: resmi kapak → Steam kapağı → Steam başlık görseli → adla üretilen desen */
function seeded(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000}}
function coverSrcs(g){
  const b=g.appid?`https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${g.appid}/`:null;
  return [g.boxart,b&&b+"library_600x900.jpg",b&&b+"header.jpg"].filter(Boolean);
}
function cover(g){
  const r=seeded(g.id+"c");const h1=Math.floor(r()*360),h2=(h1+40+Math.floor(r()*80))%360,a=Math.floor(r()*180);
  const pat=`radial-gradient(circle at ${20+r()*60}% ${20+r()*50}%,hsl(${h2} 80% 65% / .9) 0 ${10+r()*14}%,transparent ${12+r()*16}%),repeating-linear-gradient(${a}deg,hsl(${h1} 55% 32%) 0 14px,hsl(${h1} 55% 27%) 14px 28px),hsl(${h1} 55% 30%)`;
  const srcs=coverSrcs(g);
  const img=srcs.length?`<img src="${esc(srcs[0])}" data-fb="${esc(srcs.slice(1).join("|"))}" alt="" loading="lazy" onerror="imgFail(this)">`:"";
  return `<div class="cov" style="--pat:${pat}" aria-hidden="true"><span>${esc(g.title)}</span>${img}</div>`;
}
function imgFail(el){const rest=(el.dataset.fb||"").split("|").filter(Boolean);if(rest.length){el.dataset.fb=rest.slice(1).join("|");el.src=rest[0]}else el.remove()}
const isATL=p=>p&&p.lowAll!=null&&p.price<=p.lowAll+0.005;
const atlBadge=(p,long)=>isATL(p)?`<span class="atl" title="${t("atl")}">★ ${t(long?"atl":"atlShort")}</span>`:"";
// Farklı para birimindeki fiyatı seçilen para birimine yaklaşık çevir (güncel kurla)
function conv(amount,from,to){
  const r=state.config.rates?.perUsd;
  if(!r||from===to||!r[from]||!r[to])return null;
  return amount/r[from]*r[to];
}
function approx(p){
  if(!p||!(p.price>0)||p.currency===state.cur)return "";
  const v=conv(p.price,p.currency,state.cur);
  if(v==null)return "";
  const txt=new Intl.NumberFormat(loc(),{style:"currency",currency:state.cur,maximumFractionDigits:v>=100?0:2}).format(v);
  return `<span class="approx" title="${esc(t("approxTitle"))}">≈ ${txt}</span>`;
}
const offTier=c=>c>=75?"t4":c>=50?"t3":c>=25?"t2":"t1";
function tag(p,withOld=true){
  return `<span class="tag"><span class="now">${money(p.price,p.currency)}</span>${withOld&&p.cut?`<span class="was">${money(p.regular,p.currency)}</span>`:""}${p.cut?`<span class="off ${offTier(p.cut)}">-%${p.cut}</span>`:""}${approx(p)}</span>`;
}
// bildirim: açık pencerelerin de üstünde görünsün diye "popover" katmanında gösterilir
let tt,tt2;function toast(m){
  const el=$("toast");el.textContent=m;clearTimeout(tt);clearTimeout(tt2);
  if(el.showPopover){try{if(el.matches(":popover-open"))el.hidePopover();el.showPopover()}catch(e){}}
  requestAnimationFrame(()=>el.classList.add("on"));
  tt=setTimeout(()=>{el.classList.remove("on");tt2=setTimeout(()=>{try{el.hidePopover?.()}catch(e){}},300)},3800);
}

let listReq=0,pendingTimer;
async function loadList(reset=true){
  const my=++listReq;
  if(reset){state.page=0;if(!state.items.length){state.status="loading";renderGrid()}}
  const params=new URLSearchParams({country:countryCode(),page:String(state.page),sort:state.sort});
  if(state.q.trim())params.set("q",state.q.trim());
  if(state.letter)params.set("letter",state.letter);
  params.set("all","1");
  if(state.shop)params.set("shop",state.shop);
  if(state.onlyDeals)params.set("deals","1");
  if(state.cat)params.set("cat",state.cat);
  try{
    const d=await api(`/api/games?${params}`);
    if(my!==listReq)return;
    remember(d.games);
    if(reset)$("grid").style.minHeight=$("grid").offsetHeight+"px";   // yenilenirken sayfa kısalıp zıplamasın
    state.items=reset?d.games:[...state.items,...d.games];
    state.total=d.total;state.updatedAt=d.updatedAt;
    state.status=!d.updatedAt&&!d.total?"syncing":"ok";
  }catch(e){if(my!==listReq)return;if(reset)state.status="error"}
  state.loadingMore=false;
  renderFooter();renderGrid();
  requestAnimationFrame(()=>{$("grid").style.minHeight=""});
  // fiyatı getirilmekte olan oyunlar varsa biraz sonra listeyi tazele
  clearTimeout(pendingTimer);
  if(state.page===0&&state.items.some(g=>g.pending&&!g.low))pendingTimer=setTimeout(()=>{if(!dlg.open&&state.page===0)loadList(true)},30000);
}

  renderDeals();
}

function leftText(iso){
  const ms=Date.parse(iso)-Date.now();if(!(ms>0))return t("endDone");
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  return d?t("endDH",{d,h}):h?t("endHM",{h,m}):t("endM",{m:Math.max(1,m)});
}

      <h3>${esc(g.title)}</h3>${tag(g.low)}
      <div class="ends"><span class="countdown${Date.parse(g.low.expiry)-Date.now()<864e5?" soon":""}" data-exp="${esc(g.low.expiry)}">⏱ ${leftText(g.low.expiry)}</span><br>${esc(g.low.shop)}</div></div></button>`).join("");
}

function onSearchInput(){
  $("qClear").hidden=!state.q;
  // aramaya başlarken bir kez sonuçların başına kay; sonraki tuşlarda sayfa hiç oynamasın
  if(!state.q)searchAnchored=false;
  else if(!searchAnchored){
    searchAnchored=true;
    const top=$("results").getBoundingClientRect().top,hh=document.querySelector("header.top").offsetHeight;
    if(top<hh)scrollTo({top:scrollY+top-hh-12,behavior:"instant"});
  }
  clearTimeout(searchTimer);clearTimeout(remoteTimer);
  searchTimer=setTimeout(()=>loadList(true),250);
  const q=state.q.trim();
  if(q.length<3){state.searching=false;return}
  remoteTimer=setTimeout(async()=>{
    state.searching=true;renderGrid();
    try{
      const d=await api(`/api/search?q=${encodeURIComponent(q)}&country=${countryCode()}`);
      if(d.added>0&&state.q.trim()===q)await loadList(true);
    }catch(e){}
    if(state.q.trim()===q){state.searching=false;renderGrid()}
  },700);
}

function goSlide(i){
  const slides=[...document.querySelectorAll("#slides .slide")];if(!slides.length)return;

  $("slides").style.transform=`translateX(-${slideIdx*100}%)`;
  slides.forEach((s,k)=>{s.classList.toggle("on",k===slideIdx);s.setAttribute("aria-hidden",k!==slideIdx)});
  // görüntüleri sadece gösterilecek ve bir sonraki slayt için yükle
  [slideIdx,(slideIdx+1)%n].forEach(k=>{const im=slides[k].querySelector("img.bg[data-src]");if(im){im.src=im.dataset.src;im.removeAttribute("data-src")}});
  document.querySelectorAll(".sdots button").forEach((b,k)=>b.setAttribute("aria-current",k===slideIdx));
  const bar=$("sbar");
  if(bar){bar.classList.remove("run");void bar.offsetWidth;if(state.autoslide&&n>1)bar.classList.add("run")}
}

/* ---------- Fiyat geçmişi grafiği (süre seçimli) ---------- */
const RANGES=[[3,"r3m"],[6,"r6m"],[12,"r1y"],[0,"rAll"]];
// geçmiş kayıtlar: o günün en düşük fiyatı, sadece şu anki para birimindekiler, eskiden yeniye
function histPoints(d){
  const lo=d.low;if(!lo)return [];
  return d.history.filter(h=>h.currency===lo.currency).map(h=>({x:Date.parse(h.day+"T12:00:00Z"),v:h.lowest})).sort((a,b)=>a.x-b.x);
}
function chart(d){
  const lo=d.low;
  if(!lo)return {svg:"",trend:"",lows:"",range:""};
  const cur=lo.currency,DAY=864e5,end=Date.now(),months=state.chartRange;
  const all=histPoints(d);
  const start=months?end-months*30.44*DAY:(all.length?all[0].x:end-92*DAY);
  // dönemin başındaki fiyat = başlangıçtan önceki son kayıt (basamaklı çizgi o fiyattan başlar)
  const before=all.filter(p=>p.x<start).pop();
  const pts=all.filter(p=>p.x>=start);
  if(before)pts.unshift({x:start,v:before.v});
  pts.push({x:end,v:lo.price});
  const rangeLow=Math.min(...pts.map(p=>p.v));
  const range=`<div class="seg rangeseg" role="group" aria-label="${t("chartTitle")}">${RANGES.map(([m,k])=>`<button data-range="${m}" aria-pressed="${months===m}">${t(k)}</button>`).join("")}</div>`;
  const lowsHtml=`<div class="lows"><span>${t("now")}: <b>${money(lo.price,cur)}</b></span>${pts.length>1?`<span>${t("lowRange")}: <b>${money(rangeLow,cur)}</b></span>`:""}${lo.lowAll!=null?`<span>${t("lowAll")}: <b>${money(lo.lowAll,cur)}</b></span>`:""}</div>`;
  if(pts.length<2)return {svg:`<p class="note">${t("noHistory")}</p>`,trend:"",lows:lowsHtml,range};
  const vals=pts.map(p=>p.v);
  const W=600,H=230,P={l:74,r:14,t:14,b:30};
  let min=Math.min(...vals),max=Math.max(...vals);if(max===min){max+=1;min=Math.max(0,min-1)}
  min=Math.max(0,min-(max-min)*.15);max=max+(max-min)*.12;
  const x0=pts[0].x,span=(end-x0)/DAY;
  const x=v=>P.l+(v-x0)/((end-x0)||1)*(W-P.r-P.l),y=v=>P.t+(max-v)/(max-min)*(H-P.t-P.b);
  // basamaklı çizgi: fiyat bir sonraki değişime kadar aynı kalır
  let path=`M${x(pts[0].x)},${y(pts[0].v)}`;
  for(let i=1;i<pts.length;i++)path+=` H${x(pts[i].x)} V${y(pts[i].v)}`;
  const area=`${path} V${H-P.b} H${x(pts[0].x)} Z`;
  // ay etiketleri: uzun dönemde 2-3 ayda bir, yıl da yazılır
  const step=span>700?6:span>400?3:span>200?2:1;
  const mf=new Intl.DateTimeFormat(loc(),span>330?{month:"short",year:"2-digit"}:{month:"short"});
  const ticks=[];const t0=new Date(x0);
  for(let dt=new Date(t0.getFullYear(),t0.getMonth()+1,1);dt.getTime()<=end;dt=new Date(dt.getFullYear(),dt.getMonth()+step,1))ticks.push(dt.getTime());
  while(ticks.length&&x(ticks[ticks.length-1])>W-P.r-60)ticks.pop();
  const first=pts[0].v,last=lo.price,pct=first?Math.round(Math.abs(last-first)/first*100):0,r=t("rIn"+months);
  const trend=last<first?`<span class="trend down">↓ ${t("fell",{p:pct,r})}</span>`:last>first?`<span class="trend up">↑ ${t("rose",{p:pct,r})}</span>`:`<span class="trend">${t("same",{r})}</span>`;
  const gid="g"+Math.random().toString(36).slice(2,7);
  const dots=pts.length<=60?pts:[pts[pts.length-1]];   // çok noktalı uzun dönemde sadece bugünün noktası
  const svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("chartTitle")}">
   <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--coin)" stop-opacity=".35"/><stop offset="1" stop-color="var(--coin)" stop-opacity="0"/></linearGradient></defs>
   ${[max,(max+min)/2,min].map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${money(v,cur)}</text>`).join("")}
   ${ticks.map(m=>`<text x="${x(m)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${mf.format(new Date(m))}</text>`).join("")}
   <text x="${W-P.r}" y="${H-8}" text-anchor="end" font-size="12" fill="var(--muted)">${t("today")}</text>
   <line x1="${P.l}" x2="${W-P.r}" y1="${y(rangeLow)}" y2="${y(rangeLow)}" stroke="var(--down)" stroke-dasharray="5 5" stroke-width="1.5"/>
   <path d="${area}" fill="url(#${gid})"/>
   <path d="${path}" fill="none" stroke="var(--coin)" stroke-width="${pts.length>60?2:3}" stroke-linejoin="round"/>
   ${dots.map(p=>`<circle cx="${x(p.x)}" cy="${y(p.v)}" r="4" fill="var(--surface)" stroke="var(--coin)" stroke-width="2.5"><title>${fmtDate(p.x)}: ${money(p.v,cur)}</title></circle>`).join("")}
  </svg>`;
  return {svg,trend,lows:lowsHtml,range};
}

/* ---------- "Şimdi al mı, bekle mi?" önerisi: fiyat geçmişine bakarak ---------- */
// sonuç: { kind: good | wait | ok | info, head: başlık, txt: açıklama }
function adviceData(d){
  const lo=d?.low;if(!lo||!(lo.price>0))return null;
  const cur=lo.currency,DAY=864e5,now=Date.now(),p=lo.price,reg=lo.regular||p;
  const all=histPoints(d);
  const year=all.filter(h=>h.x>=now-365*DAY);
  const known=all.length?(now-all[0].x)/DAY:0;           // kaç günlük geçmiş var
  const minYear=Math.min(p,...year.map(h=>h.v));
  let kind,txt;
  if(lo.lowAll!=null&&p<=lo.lowAll*1.01){kind="good";txt=t("advAtl")}
  else if(lo.cut>0&&known>=60&&p<=minYear*1.03){kind="good";txt=t("advYearLow")}
  else if(known>=60&&minYear<=p*0.85){kind="wait";txt=t(lo.cut>0?"advBetterSeen":"advWait",{p:money(minYear,cur),c:Math.round((1-minYear/reg)*100)})}
  else if(known>=180){kind="ok";txt=t("advStable")}
  else{kind="info";txt=t("advNoData")}
  let ends="";
  if(lo.cut>0&&lo.expiry){const n=Math.ceil((Date.parse(lo.expiry)-now)/DAY);if(n>=0&&n<=14)ends=" "+t(n<=1?"advEndsSoon":"advEnds",{n})}
  const head={good:"advGoodT",wait:"advWaitT",ok:"advOkT",info:"advInfoT"}[kind];
  return {kind,head:t(head),txt:txt+ends};
}
function advice(d){
  const a=adviceData(d);
  return a?`<div class="advice ${a.kind}" role="note"><b>${a.head}</b><span>${a.txt}</span></div>`:"";
}

function syncUrl(replace=urlReplace){
  const g=isGameOpen()?state.known[state.open]:null;
  const want=g?gamePath(g):"/";
  if(location.pathname===want)return;
  if(g&&!replace)history.pushState({game:g.id},"",want);else history.replaceState(g?{game:g.id}:{},"",want);
}
// sayfa doğrudan /oyun/... adresiyle açıldıysa oyunu getirip göster
async function openFromPath(){
  if(!location.pathname.startsWith("/oyun/"))return false;
  const key=decodeURIComponent(location.pathname.slice(6));
  try{
    const d=await api(`/api/games/${encodeURIComponent(key)}?country=${countryCode()}`);
    remember([{...d.game,tags:d.game.tags.slice(0,2)}]);
    state.details[detailKey(d.game.id)]=d.game;
    await openGame(d.game.id,true);
  }catch(e){history.replaceState({},"","/");toast(t("gameNotFound"))}
  return true;
}
async function copyGameLink(id){
  const url=location.origin+gamePath(state.known[id]||{id});
  try{await navigator.clipboard.writeText(url)}
  catch(e){const ta=document.createElement("textarea");ta.value=url;document.body.append(ta);ta.select();document.execCommand("copy");ta.remove()}
  toast(t("linkCopied"));
}
window.addEventListener("popstate",()=>{
  if(location.pathname.startsWith("/oyun/")){
    const id=history.state?.game;
    if(id&&state.known[id]){state.open=id;renderDetail(id);openDialog(true)}else openFromPath();
  }else if(dlg.open&&isGameOpen())dlg.close();
});
async function loadSimilar(id){
  const key=detailKey(id);
  if(state.similar[key])return;
  try{state.similar[key]=remember((await api(`/api/games/${encodeURIComponent(id)}/similar?country=${countryCode()}`)).games)}catch(e){state.similar[key]=[]}
  if(state.open===id&&dlg.open)renderDetail(id);
}
async function openGame(id,replaceUrl=false){
  state.open=id;
  renderDetail(id);urlReplace=replaceUrl;openDialog(true);urlReplace=false;
  const key=detailKey(id);
  if(state.details[key])return;
  try{
    const d=await api(`/api/games/${encodeURIComponent(id)}?country=${countryCode()}`);
    state.details[key]=d.game;
    remember([{...d.game,tags:d.game.tags.slice(0,2)}]);
    loadSimilar(id);
  }catch(e){state.details[key]={error:true}}
  if(state.open===id&&dlg.open)renderDetail(id);
}
function renderDetail(id){
  const base=state.known[id];if(!base)return;
  const d=state.details[detailKey(id)];
  const ok=d&&!d.error;
  const g={...base,...(ok?d:{}),boxart:(ok&&d.boxart)||base.boxart};
  const inWish=state.wish.includes(id);
  const low=ok?d.low:base.low;
  const wishBtn=state.user
    ?`<button class="btn ${inWish?"":"primary"}" data-wish="${id}">${inWish?t("removeWish"):t("addWish")}</button>`
    :`<button class="btn primary" data-open-auth="${id}">${t("loginToWish")}</button>`;
  let prices,chartPanel="";
  if(!d)prices=`<p class="note">${t("detailLoading")}</p>`;
  else if(d.error)prices=`<p class="note">${t("detailErr")}</p>`;
  else{
    const rows=d.prices,others=[...new Set(rows.map(r=>r.currency).filter(c=>c!==state.cur))];
    const bestShop=low?.shop;
    prices=rows.length?`<div class="tbl-wrap"><table><thead><tr><th>${t("store")}</th><th>${t("price")}</th><th>${t("normal")}</th><th>${t("endsOn")}</th><th></th></tr></thead><tbody>
      ${rows.map(p=>`<tr class="${p.shop===bestShop?"best-row":""}"><td>${esc(p.shop)}${p.shop===bestShop?`<span class="badge">${t("cheapest")}</span>`:""}</td>
       <td>${tag(p,false)}</td><td>${money(p.regular,p.currency)}</td><td>${p.cut&&p.expiry?fmtDate(p.expiry):"—"}</td>
       <td>${p.url?`<a class="shoplink" href="${esc(p.url)}" target="_blank" rel="noopener">${t("goStore")} ↗</a>`:""}</td></tr>`).join("")}
     </tbody></table></div>${others.length?`<p class="note">${t("otherCur",{c:others.join(", ")})}</p>`:""}`
     :`<p class="note">${t(g.free?"freeGame":g.pending?"pendingPrice":"noPrice")}</p>`;
    const c=chart(d);
    if(c.svg||c.lows)chartPanel=`<div class="panel"><div class="panelhead"><h3>${t("chartTitle")}</h3>${c.range}</div>${c.trend}${c.svg}${c.lows}</div>`;
    if(d.requirements)chartPanel+=reqPanel(d.requirements);
  }
  $("dlgBody").innerHTML=`
   <div class="dlg-head"><button class="btn ghost copylink" data-copy-link="${esc(id)}"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>${t("copyLink")}</button><button class="x" data-close aria-label="${t("close")}">✕</button></div>
   <div class="dh">${cover(g)}
    <div>
     <h2>${esc(g.title)}</h2>
     ${g.tags?.length?`<ul class="chips">${g.tags.slice(0,6).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
     <dl class="facts">
      ${g.releaseDate?`<dt>${t("release")}</dt><dd>${fmtDate(g.releaseDate)}</dd>`:""}
      ${g.developers?.length?`<dt>${t("developer")}</dt><dd>${esc(g.developers.join(", "))}</dd>`:""}
      ${g.rating?`<dt>${t("ratingLabel")}</dt><dd>${rateBadge(g.rating,true)} <span class="note">${t("reviews",{n:num(g.rating.pos+g.rating.neg)})}</span></dd>`:""}
     </dl>
     <div class="best">
      ${low?`<div><div class="lbl">${t("bestNow")}, ${esc(low.shop)}</div>${tag(low)}${isATL(low)?` ${atlBadge(low,true)}`:""}</div>`
        :`<div class="lbl">${t(g.free?"freeGame":"noPrice")}</div>`}
      <div class="actions">${wishBtn}<button class="btn" data-cmp="${id}">${state.compare.includes(id)?"✓ "+t("cmpRemove"):"⇄ "+t("cmpAdd")}</button></div>
      ${state.user&&inWish?targetForm(id,low):""}
     </div>
     ${ok?advice(d):""}
    </div>
   </div>
   <div class="dgrid"><div class="panel"><h3>${t("pricesTitle")}</h3>${prices}</div>${chartPanel?`<div class="dcol">${chartPanel}</div>`:""}</div>
   ${(state.similar[detailKey(id)]||[]).length?`<div class="panel sim"><h3>${t("simTitle")}</h3><div class="simrow">${state.similar[detailKey(id)].map(x=>`<button class="simcard" data-g="${x.id}">${cover(x)}<b>${esc(x.title)}</b>${x.low?tag(x.low):""}</button>`).join("")}</div></div>`:""}`;
  bindTarget(id,low);
}

function targetForm(id,low){
  const tg=state.targets[id],cur=tg?.currency||low?.currency||state.cur;
  return `<div class="target" id="tgtBox" style="flex-basis:100%">
    <label for="tgt">${t("targetLbl")}</label>
    <input type="number" id="tgt" min="0" step="0.01" inputmode="decimal" value="${tg?tg.price:""}" placeholder="${low?Math.floor(low.price*0.8):""}"><span>${cur}</span>
    <button class="btn primary" id="tgtSave">${t("targetSave")}</button>${tg?`<button class="btn ghost" id="tgtDel">${t("targetRemove")}</button>`:""}
    <p class="tgt-err" id="tgtErr" role="alert" hidden></p>
    <span class="note" style="flex-basis:100%;margin:2px 0 0">${tg?`<b>${t("targetActive",{p:money(tg.price,tg.currency)})}</b> · `:""}${t("targetNote")}</span></div>`;
}
function bindTarget(id,low){
  if(!$("tgtSave"))return;
  const cur=state.targets[id]?.currency||low?.currency||state.cur;
  $("tgtSave").onclick=async()=>{
    const v=Number(String($("tgt").value).replace(",","."));
    const err=m=>{$("tgtErr").textContent=m;$("tgtErr").hidden=false;$("tgt").focus()};
    if(!(v>0))return err(t("targetBad"));
    try{const d=await api(`/api/wishlist/${encodeURIComponent(id)}`,{method:"PATCH",body:{target:v,currency:cur}});
      state.targets[id]={price:v,currency:cur};toast(d.already?t("targetAlready"):t("targetSet",{p:money(v,cur)}));renderDetail(id)}
    catch(e){err(t("errServer"))}
  };
  $("tgt").addEventListener("input",()=>{$("tgtErr").hidden=true});
  $("tgt").addEventListener("keydown",e=>{if(e.key==="Enter")$("tgtSave").click()});
  if($("tgtDel"))$("tgtDel").onclick=async()=>{
    try{await api(`/api/wishlist/${encodeURIComponent(id)}`,{method:"PATCH",body:{target:null}});delete state.targets[id];toast(t("targetRemoved"));renderDetail(id)}catch(e){}
  };
}
const REQ_TR={"OS":"İşletim sistemi","Processor":"İşlemci","Memory":"Bellek","Graphics":"Ekran kartı","DirectX":"DirectX","Storage":"Depolama","Hard Drive":"Depolama","Network":"Ağ","Sound Card":"Ses kartı","Additional Notes":"Ek notlar","VR Support":"VR desteği"};
function reqPanel(r){
  if(r.none)return `<div class="panel"><h3>${t("reqTitle")}</h3><p class="note">${t(r.steam?"reqNone":"reqNoSteam")}</p></div>`;
  const list=rows=>rows.length?`<dl>${rows.map(x=>`${x.k?`<dt>${esc(state.lang==="tr"?(REQ_TR[x.k.replace(/\s*\*$/,"")]||x.k):x.k)}</dt>`:""}<dd>${esc(x.v)}</dd>`).join("")}</dl>`:`<p class="note">—</p>`;
  return `<div class="panel"><h3>${t("reqTitle")}</h3><div class="req">
    <div><h4>${t("reqMin")}</h4>${list(r.min)}</div>${r.rec.length?`<div><h4>${t("reqRec")}</h4>${list(r.rec)}</div>`:""}</div></div>`;
}

function authForm(mode,idp){
  return `<div class="form">
    ${mode==="up"?`<label for="${idp}n">${t("name")}</label><input type="text" id="${idp}n" autocomplete="nickname">`:""}
    <label for="${idp}e">${t("email")}</label><input type="email" id="${idp}e" autocomplete="email">
    <label for="${idp}p">${t("password")}</label><input type="password" id="${idp}p" autocomplete="${mode==="in"?"current-password":"new-password"}">
    ${mode==="in"?`<div class="forgot-row"><button class="linkbtn" data-forgot>${t("forgot")}</button></div>`
      :`<label class="check consent"><input type="checkbox" id="${idp}c"><span>${t("consentPre")}<button type="button" class="linkbtn" data-legal="kvkk">${t("consentLink")}</button>${t("consentPost")}</span></label>`}
    <div class="err" id="${idp}err" role="alert"></div>
    <button class="btn primary" style="width:100%;height:48px;justify-content:center" id="${idp}sub">${mode==="in"?t("signin"):t("register")}</button>
  </div>`;
}
function bindAuthForm(mode,idp,onDone){
  const submit=async()=>{
    const e=$(idp+"e").value.trim().toLowerCase(),p=$(idp+"p").value;
    if(!e||!p)return $(idp+"err").textContent=t("errFill");
    if(p.length<6)return $(idp+"err").textContent=t("errPass");
    if(mode==="up"&&!$(idp+"c").checked)return $(idp+"err").textContent=t("errConsent");
    $(idp+"sub").disabled=true;
    try{await authRequest(mode,{email:e,password:p,name:$(idp+"n")?.value.trim(),consent:mode==="up"&&$(idp+"c").checked});onDone()}
    catch(err){$(idp+"err").textContent=authErr(err.code);$(idp+"sub").disabled=false}
  };
  $(idp+"sub").onclick=submit;
  $(idp+"p").addEventListener("keydown",ev=>{if(ev.key==="Enter")submit()});
  setTimeout(()=>($(idp+"n")||$(idp+"e")).focus(),40);
}
function openAuth(mode="in",back=null){
  state.open=null;
  $("dlgBody").innerHTML=`
   <div class="dlg-head"><h2>${mode==="in"?t("signin"):t("register")}</h2><button class="x" data-close aria-label="${t("close")}">✕</button></div>
   <div class="tabs" role="tablist"><button role="tab" aria-selected="${mode==="in"}" data-mode="in">${t("signin")}</button><button role="tab" aria-selected="${mode==="up"}" data-mode="up">${t("register")}</button></div>
   ${authForm(mode,"a")}`;
  bindAuthForm(mode,"a",()=>{if(back)openGame(back);else dlg.close()});
  $("dlgBody").querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>openAuth(b.dataset.mode,back));
  openDialog(false);
}

function openReset(token){
  state.open="__reset";
  $("dlgBody").innerHTML=`
   <div class="dlg-head"><h2>${t("resetTitle")}</h2><button class="x" data-close aria-label="${t("close")}">✕</button></div>
   <div class="form">

    <div class="err" id="rerr" role="alert"></div>
    <button class="btn primary" style="width:100%;height:48px;justify-content:center" id="rsub">${t("resetSave")}</button></div>`;
  $("rsub").onclick=async()=>{
    const a=$("rp1").value,b=$("rp2").value;
    if(a.length<6)return $("rerr").textContent=t("errPass");
    if(a!==b)return $("rerr").textContent=t("errMatch");
    $("rsub").disabled=true;
    try{const d=await api("/api/auth/reset",{method:"POST",body:{token,password:a}});
      state.user=d.user;store.set("g_welcomed",true);closeWelcome();await loadWish();dlg.close();toast(t("resetDone"))}

  };
  openDialog(false);setTimeout(()=>$("rp1").focus(),40);

// E-postadaki bağlantılar siteyi ?verify=... ya da ?reset=... ile açar
async function handleLinks(){
  const q=new URLSearchParams(location.search),v=q.get("verify"),r=q.get("reset");
  if(!v&&!r)return false;
  history.replaceState({},"",location.pathname);
  store.set("g_welcomed",true);
  if(r){openReset(r);return true}
  try{await api("/api/auth/verify",{method:"POST",body:{token:v}});toast(t("verifyDone"));if(state.user)state.user.emailVerified=true}
  catch(e){toast(t("errToken"))}
  return true;
}
function verifyNotice(){
  return state.user&&!state.user.emailVerified?`<div class="notice">${t("verifyNeed")} <button class="linkbtn" data-resend>${t("verifyResend")}</button></div>`:"";
}
async function resendVerify(){
  try{await api("/api/auth/resend",{method:"POST"});toast(t("verifySent"))}catch(e){toast(authErr(e.code))}
}

async function openWish(){
  state.open="__wish";
  const head=`<div class="dlg-head"><h2>${t("wishlist")}</h2><button class="x" data-close aria-label="${t("close")}">✕</button></div>`;
  if(!state.user){$("dlgBody").innerHTML=head+`<p>${t("wishLogin")}</p><button class="btn primary" data-open-auth="">${t("login")}</button>`;openDialog(false);return}
  await loadWish();
  const w=state.wish.map(id=>state.known[id]).filter(Boolean);
  let html=head+verifyNotice()+(w.length?w.map(g=>`<div class="wish-item">${cover(g)}<div><button class="t" data-g="${g.id}">${esc(g.title)}</button><div style="color:var(--muted);font-size:13px">${g.low?esc(g.low.shop):t(g.free?"freeGame":"noPrice")}</div></div>${g.low?tag(g.low):"<span></span>"}<button class="btn ghost rm" data-unwish="${g.id}">${t("remove")}</button></div>`).join("")
    :`<div class="nada">${ICON_HEART}<b>${t("wishEmptyTitle")}</b><p>${t("wishEmpty")}</p><button class="btn primary" data-close>${t("wishBrowse")}</button></div>`);
  let mails=[];try{mails=(await api("/api/notifications")).items}catch(e){}
  if(mails.length)html+=`<h3 style="font:600 17px var(--display);margin:22px 0 6px">${t("mails")} (${esc(state.user.email)})</h3>`+mails.map(m=>`<div class="mail">${esc(m.text)}<br><small>${fmtDate(m.sent_at.replace(" ","T")+"Z")}</small></div>`).join("");
  if(state.open!=="__wish"&&dlg.open)return;
  $("dlgBody").innerHTML=html;
  openDialog(false);
}

let profileTab="profile",avatarQ="",avatarSrc="popular",avReq=0;
const avTile=(g,cur)=>`<button data-av="${esc(g.id)}" aria-pressed="${g.id===cur}" title="${esc(g.title)}"><span class="ring">${cover(g)}</span><span class="tt">${esc(g.title)}</span></button>`;
async function loadAvatars(){
  const grid=$("avGrid");if(!grid)return;
  const my=++avReq;   // yavaş gelen eski cevap yenisinin üstüne yazmasın
  grid.innerHTML=Array.from({length:12},()=>`<div class="sk" style="display:flex;flex-direction:column;align-items:center;gap:7px"><span class="ring"></span><span class="tt"></span></div>`).join("");
  let list=[];
  const qs=avatarQ?`?q=${encodeURIComponent(avatarQ)}`:avatarSrc==="wish"?"?src=wish":"";
  try{list=(await api(`/api/avatars${qs}`)).games}catch(e){}
  if(my!==avReq||!$("avGrid"))return;
  const u=state.user,cur=u?.avatar?.id;
  const letter=`<button data-av="" aria-pressed="${!cur}" title="${esc(t("pAvatarLetter"))}"><span class="ring letter">${esc((u?.name||"?").trim().charAt(0).toLocaleUpperCase(loc()))}</span><span class="tt">${t("pAvatarLetter")}</span></button>`;
  const empty=`<p class="empty">${avatarQ?t("pAvatarNone"):avatarSrc==="wish"?t("pAvatarWishEmpty"):t("pAvatarNone")}</p>`;
  grid.innerHTML=(avatarQ?"":letter)+(list.length?list.map(g=>avTile(g,cur)).join(""):empty);
}

function openProfile(tab){
  const u=state.user;if(!u)return openAuth("in");

async function getCovers(){
  if(!state.covers){
    state.covers=api("/api/covers").then(d=>d.games).catch(()=>[]);
  }
  let covers=await state.covers;
  if(covers.length<12)covers=[...covers,...Object.values(state.known)].slice(0,60);
  return covers;
}
function wallHtml(covers,lanes,perLane){
  if(!covers.length)return "";
  const tiles=covers.map(g=>cover(g));
  const need=lanes*perLane;
  while(tiles.length<need)tiles.push(...tiles.slice(0,need-tiles.length));
  return Array.from({length:lanes},(_,i)=>{const row=tiles.slice(i*perLane,i*perLane+perLane);return `<div class="lane">${row.join("")}${row.join("")}</div>`}).join("");
}
async function renderBackdrop(){
  const el=$("backdrop");
  if(!state.backdrop){el.hidden=true;el.innerHTML="";return}
  const covers=await getCovers();
  if(!covers.length||!state.backdrop)return;
  // karışık görünsün diye sırayı karıştır
  const mixed=[...covers].sort((a,b)=>seeded(a.id)()-seeded(b.id)());
  el.innerHTML=`<div class="wall">${wallHtml(mixed,5,14)}</div>`;
  el.hidden=false;
}

    <p>Başvurularını ${mail} adresine iletebilirsin. Başvurun en geç 30 gün içinde ücretsiz olarak sonuçlandırılır.</p>`,
   privacy:`<h2>Gizlilik Politikası</h2>

$("dlg2").addEventListener("click",e=>{if(e.target===$("dlg2"))$("dlg2").close()});
function maybeCookieBar(){
  if(store.get("g_cookie_ok",false))return;
  $("cookiebar").hidden=false;document.body.classList.add("cookie-on");
  // başa dön düğmesi çerez çubuğunun üstünde dursun (çubuğun yüksekliği ekran genişliğine göre değişiyor)
  const fit=()=>document.body.style.setProperty("--cb",$("cookiebar").offsetHeight+"px");
  fit();addEventListener("resize",fit);
  $("cookieOk").onclick=()=>{store.set("g_cookie_ok",true);$("cookiebar").hidden=true;document.body.classList.remove("cookie-on")};
}

// Yatay listeler: kenar okları ve solma; sadece kaydırılacak içerik varsa görünür
function enhanceScroller(el){
  if(!el||el.parentElement?.classList.contains("hs"))return;
  const wrap=document.createElement("div");wrap.className="hs"+(el.classList.contains("cats")?" cats-wrap":"");
  el.parentNode.insertBefore(wrap,el);wrap.append(el);
  const arrow=(dir)=>{const b=document.createElement("button");b.type="button";b.className="hs-btn "+dir;b.tabIndex=-1;
    b.setAttribute("aria-label",t(dir==="prev"?"prevItems":"nextItems"));
    b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${dir==="prev"?"m15 5-7 7 7 7":"m9 5 7 7-7 7"}"/></svg>`;
    b.onclick=()=>el.scrollBy({left:(dir==="prev"?-1:1)*el.clientWidth*.85});wrap.append(b)};
  arrow("prev");arrow("next");
  const upd=()=>{const max=el.scrollWidth-el.clientWidth-2;wrap.classList.toggle("l",el.scrollLeft>2);wrap.classList.toggle("r",el.scrollLeft<max)};
  el.addEventListener("scroll",upd,{passive:true});new ResizeObserver(upd).observe(el);new MutationObserver(()=>requestAnimationFrame(upd)).observe(el,{childList:true});
  // fare tekerleği dikey çevrilince listeyi yatay kaydır (Shift'e gerek kalmasın) — sadece kaydırılabiliyorsa
  el.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;const max=el.scrollWidth-el.clientWidth;if(max<=0)return;
    const next=el.scrollLeft+e.deltaY;if((e.deltaY<0&&el.scrollLeft<=0)||(e.deltaY>0&&el.scrollLeft>=max-1))return;e.preventDefault();el.scrollLeft=Math.max(0,Math.min(max,next))},{passive:false});
  upd();
}
["endings","frees","cats"].forEach(id=>enhanceScroller($(id)));
new MutationObserver(()=>document.querySelectorAll("#dlgBody .simrow").forEach(enhanceScroller)).observe($("dlgBody"),{childList:true,subtree:true});
// Kaydırınca beliren bölümler ve kartlar (hareket azaltma tercihine saygı gösterir)
const rvIO="IntersectionObserver" in window&&!matchMedia("(prefers-reduced-motion: reduce)").matches
  ?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");rvIO.unobserve(e.target)}}),{rootMargin:"0px 0px -6% 0px"}):null;
if(rvIO){
  document.documentElement.classList.add("js-rv");
  document.querySelectorAll("main > section .sec-head, #results .toolbar").forEach(el=>{el.classList.add("rv");rvIO.observe(el)});
}
function revealCards(){
  if(!rvIO)return;
  let i=0;
  document.querySelectorAll("#grid .card:not(.rv):not(.skel)").forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.top<innerHeight&&r.bottom>0)return;   // ekranda zaten görünenler bekletilmeden gösterilir
    el.classList.add("rv");el.style.setProperty("--d",(i++%6)*55+"ms");rvIO.observe(el)});
}
